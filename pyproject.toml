[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrodok"
version = "0.1.0"
description = "MikroDok: Offline desktop app democratizing LLM development. Transform documents into custom 1-7B parameter models using innovative IDRAlloc memory bridging across GPU VRAM, RAM & NVMe. Built with Python Flet, PyTorch, DeepSpeed & ONNX. Complete data privacy, zero cloud dependency."
readme = "README.md"
license = {text = "Proprietary - Explicit permission required from Etemi Joshua Garba"}
authors = [
    {name = "Etemi Joshua Garba", email = "etemigarba@users.noreply.github.com"}
]
maintainers = [
    {name = "Etemi Joshua Garba", email = "etemigarba@users.noreply.github.com"}
]
keywords = [
    "llm",
    "language-model",
    "document-processing",
    "offline-ai",
    "memory-management",
    "idralloc",
    "flet",
    "pytorch",
    "onnx",
    "deepspeed",
    "rag",
    "quantization",
    "desktop-app"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Software Distribution",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
]
requires-python = ">=3.12"
dependencies = [
    "flet>=0.21.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "onnxruntime-gpu>=1.16.0",
    "deepspeed>=0.12.0",
    "transformers>=4.36.0",
    "bitsandbytes>=0.41.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "langchain>=0.1.0",
    "numpy>=1.26.0",
    "pillow>=10.1.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
    "pytesseract>=0.3.10",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "py-cpuinfo>=9.0.0",
    "pynvml>=11.5.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pyright>=1.1.300",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
]
build = [
    "flet-build>=0.1.0",
    "pyinstaller>=6.1.0",
    "cx-freeze>=6.15.0",
    "nsis>=3.09",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/etemigarba/MikroDok"
Repository = "https://github.com/etemigarba/MikroDok"
Issues = "https://github.com/etemigarba/MikroDok/issues"
Documentation = "https://github.com/etemigarba/MikroDok/wiki"
Changelog = "https://github.com/etemigarba/MikroDok/blob/main/CHANGELOG.md"

[project.scripts]
mikrodok = "src.main:main"
mikrodok-train = "src.modules.logic.training_orchestration_lg.training_executor_lg:main"
mikrodok-inference = "src.modules.logic.inference_engine_lg:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mikrodok*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default argument
    "C901",  # too complex (allow for ML code)
    "T201",  # print statements (allow for debugging)
    "S101",  # assert statements (allow for testing)
]
per-file-ignores = {
    "tests/*": ["S101", "T201"],
    "scripts/*": ["T201", "S101"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
files = ["src"]
exclude = [
    "tests",
    "scripts",
    "build",
    "dist",
    ".venv",
    "*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "ui: marks tests as UI tests",
    "gpu: marks tests as requiring GPU",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/__pycache__/*",
    "*/migrations/*",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true

[tool.pre-commit]
repos = [
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.1.0", hooks = [
        {id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"]},
        {id = "ruff-format", args = ["--check"]},
    ]},
    {repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.7.0", hooks = [
        {id = "mypy", additional_dependencies = ["types-requests", "types-PyYAML"]},
    ]},
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
        {id = "trailing-whitespace"},
        {id = "end-of-file-fixer"},
        {id = "check-yaml"},
        {id = "check-toml"},
        {id = "check-merge-conflict"},
        {id = "debugger-statements"},
        {id = "check-added-large-files"},
    ]},
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Windows"
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportMissingParameterType = "warning"
reportMissingSuperCall = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
include = ["src"]
exclude = ["tests", "scripts", "build", "dist", ".venv"]

[tool.sphinx]
source_dir = "docs"
build_dir = "docs/_build"
language = "en"

[tool.flet]
name = "MikroDok"
bundle-id = "com.etemigarba.mikrodok"
description = "Document Language Model Builder - Offline LLM Development Platform"
version = "0.1.0"
product-name = "MikroDok"
copyright = "Copyright © 2025 Etemi Joshua Garba"
category = "Developer Tools"
icon = "assets/icon.ico"
splash = "assets/splash.png"
include-packages = [
    "torch",
    "transformers",
    "deepspeed",
    "onnxruntime",
    "chromadb",
    "sentence_transformers",
    "bitsandbytes",
    "pdfplumber",
    "docx",
    "bs4",
    "pytesseract",
    "numpy",
    "PIL",
    "psutil",
    "GPUtil",
    "cpuinfo",
    "pynvml",
]
exclude-packages = [
    "tests",
    "scripts",
    "docs",
    "sphinx",
    "pytest",
    "ruff",
    "mypy",
    "pre_commit",
    "black",
    "isort",
]
include-files = [
    "assets/",
    "data/",
]