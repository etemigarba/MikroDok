---
name: Feature Request
description: Suggest an idea for MikroDok
title: "[FEATURE]: "
labels: ["enhancement", "triage"]
assignees: ["etemigarba"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A brief summary of the feature
      placeholder: Add support for custom embedding models
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why is this feature needed? What problem does it solve?
      placeholder: |
        Currently only all-MiniLM-L6-v2 is supported for embeddings.
        Users with specific domain requirements (medical, legal, code) 
        would benefit from using domain-specific embedding models.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        Add a configuration option to select embedding model from:
        - all-MiniLM-L6-v2 (current default)
        - all-mpnet-base-v2 (higher quality)
        - Custom HuggingFace model path
        - Domain-specific models (BioBERT, LegalBERT, CodeBERT)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?
      placeholder: |
        - Using external embedding API (not offline-friendly)
        - Manual model swapping (poor UX)
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this affect?
      options:
        - Document Processing
        - RAG / Search
        - Model Training
        - IDRAlloc Memory Management
        - UI / Dashboard
        - Inference Engine
        - Database
        - Configuration
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (blocking users)
        - High (significant improvement)
        - Medium (nice to have)
        - Low (future consideration)
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references
      placeholder: Links to related issues, papers, or implementations
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing feature requests
          required: true
        - label: This feature aligns with MikroDok's offline-first philosophy
          required: true
        - label: I'm willing to help implement this feature
          required: false